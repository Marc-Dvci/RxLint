# Terminology for normalisation. Aliases resolve by exact match after case folding and
# whitespace collapse; anything else is reported as unrecognised with candidates, never mapped.
ingredients:
  amoxicillin:
    display: Amoxicillin
    classes: [penicillin, beta_lactam]
    aware: Access
    aliases: [amoxicillin, amoxycillin, amoxicilline, amoxil, clamoxyl, amoxicillin trihydrate]
  clavulanic_acid:
    display: Clavulanic acid
    classes: [beta_lactamase_inhibitor]
    aliases: [clavulanic acid, clavulanate, clavulanate potassium, potassium clavulanate, acide clavulanique]
  cefalexin:
    display: Cefalexin
    classes: [cephalosporin, beta_lactam]
    aware: Access
    aliases: [cefalexin, cephalexin, céfalexine, cefalexine, keflex]
  azithromycin:
    display: Azithromycin
    classes: [macrolide]
    aware: Watch
    aliases: [azithromycin, azithromycine, zithromax]
  clarithromycin:
    display: Clarithromycin
    classes: [macrolide]
    aware: Watch
    aliases: [clarithromycin, clarithromycine, klacid, biaxin]
  phenoxymethylpenicillin:
    display: Phenoxymethylpenicillin
    classes: [penicillin, beta_lactam]
    aware: Access
    aliases: [phenoxymethylpenicillin, penicillin v, penicillin v potassium, pen v, penicillin vk, oracilline]
  sulfamethoxazole:
    display: Sulfamethoxazole
    classes: [sulfonamide]
    aliases: [sulfamethoxazole, sulphamethoxazole]
  trimethoprim:
    display: Trimethoprim
    classes: [trimethoprim]
    aliases: [trimethoprim]
  # Current-medication terms used by the interaction and duplicate rules.
  probenecid: {display: Probenecid, classes: [uricosuric], aliases: [probenecid]}
  warfarin: {display: Warfarin, classes: [oral_anticoagulant, vitamin_k_antagonist], aliases: [warfarin, coumadin]}
  acenocoumarol: {display: Acenocoumarol, classes: [oral_anticoagulant, vitamin_k_antagonist], aliases: [acenocoumarol, sintrom]}
  allopurinol: {display: Allopurinol, classes: [xanthine_oxidase_inhibitor], aliases: [allopurinol]}
  methotrexate: {display: Methotrexate, classes: [antifolate], aliases: [methotrexate]}
  phenytoin: {display: Phenytoin, classes: [antiepileptic], aliases: [phenytoin]}
  carbamazepine: {display: Carbamazepine, classes: [antiepileptic], aliases: [carbamazepine, tegretol]}
  pimozide: {display: Pimozide, classes: [antipsychotic], aliases: [pimozide]}
  cisapride: {display: Cisapride, classes: [prokinetic], aliases: [cisapride]}
  simvastatin: {display: Simvastatin, classes: [statin], aliases: [simvastatin]}
  lovastatin: {display: Lovastatin, classes: [statin], aliases: [lovastatin]}
  metformin: {display: Metformin, classes: [biguanide], aliases: [metformin]}
  nelfinavir: {display: Nelfinavir, classes: [protease_inhibitor], aliases: [nelfinavir]}
  # Common co-medications recognised so the report can state they are outside interaction coverage.
  paracetamol: {display: Paracetamol, classes: [analgesic], aliases: [paracetamol, acetaminophen, doliprane, tylenol]}
  ibuprofen: {display: Ibuprofen, classes: [nsaid], aliases: [ibuprofen, advil, nurofen]}
  salbutamol: {display: Salbutamol, classes: [bronchodilator], aliases: [salbutamol, albuterol, ventolin]}
  cetirizine: {display: Cetirizine, classes: [antihistamine], aliases: [cetirizine]}

