# Pediatric oral doses transcribed from WHO AWaRe Table 50.1 (Dosing guidance - Children).
# weight_dose passes when the dose is inside the mg/kg range OR equals the Table 50.1 weight-band
# dose for the patient's weight, each within policy P-ROUND-01. Deviations escalate by P-SEV-01.

# ---------------- Amoxicillin ----------------
- id: AWARE-AMX-PED-001
  version: 1.0.0
  title: Amoxicillin daily dose for body weight
  type: weight_dose
  severity: high
  applies_to: {product: amoxicillin}
  component: amoxicillin
  requires: [patient.weight_kg, rx.dose, rx.frequency, dispensed.strength]
  params:
    basis: per_day
    range_mg_per_kg: [80, 90]
    weight_bands:
      - {min: 3, max: 6, dose_mg: 250, per_day: 2}
      - {min: 6, max: 10, dose_mg: 375, per_day: 2}
      - {min: 10, max: 15, dose_mg: 500, per_day: 2}
      - {min: 15, max: 20, dose_mg: 750, per_day: 2}
      - {min: 20, dose_mg: 500, per_day: 3}
      - {min: 20, dose_mg: 1000, per_day: 2}
  source:
    ref: WHO-AWARE-2022
    locator: {printed_page: 640, pdf_page: 656, table: "50.1", row: Amoxicillin}
    quote:
      - "Oral: 80–90 mg/kg/day"
      - "3–<6 kg: 250 mg given every 12 hours"
      - "6–<10 kg: 375 mg given every 12 hours"
      - "10–<15 kg: 500 mg given every 12 hours"
      - "15–<20 kg: 750mg given every 12 hours"
      - "≥ 20 kg: 500 mg given every 8 hours or 1 g given every 12 hours"

- id: AWARE-AMX-PED-002
  version: 1.0.0
  title: Amoxicillin maximum daily dose
  type: max_daily_dose
  severity: advisory
  applies_to: {product: amoxicillin}
  component: amoxicillin
  requires: [rx.dose, rx.frequency, dispensed.strength]
  params: {limit_mg: 1500}
  source:
    ref: WHO-AWARE-2022
    locator: {printed_page: 640, pdf_page: 656, table: "50.1", row: Amoxicillin}
    quote: "Up to a maximum daily dose of 1.5 g but can be higher for serious bacterial infections"
  explain: >
    WHO allows a higher daily dose for serious bacterial infections, so exceeding 1.5 g is a note
    for the pharmacist and does not change the verdict.

- id: AWARE-AMX-PED-003
  version: 1.0.0
  title: Amoxicillin dosing interval
  type: frequency_allowed
  severity: moderate
  applies_to: {product: amoxicillin}
  requires: [rx.frequency, patient.weight_kg]
  params:
    by_weight:
      - {min: 3, max: 20, per_day: [2]}
      - {min: 20, per_day: [2, 3]}
  source:
    ref: WHO-AWARE-2022
    locator: {printed_page: 640, pdf_page: 656, table: "50.1", row: Amoxicillin}
    quote:
      - "15–<20 kg: 750mg given every 12 hours"
      - "≥ 20 kg: 500 mg given every 8 hours or 1 g given every 12 hours"

