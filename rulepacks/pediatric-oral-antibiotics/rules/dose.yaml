    locator: {printed_page: 641, pdf_page: 657, table: "50.1", row: Amoxicillin+clavulanic acid}
    quote:
      - "15–< 20 kg: 750 mg of amoxicillin/dose given every 12 hours"
      - "≥ 20 kg: 500 mg of amoxicillin/dose given every 8 hours or 1 g of amoxicillin/ dose given every 12 hours"

# ---------------- Cefalexin ----------------
- id: AWARE-CFX-PED-001
  version: 1.0.0
  title: Cefalexin dose for body weight
  type: weight_dose
  severity: high
  applies_to: {product: cefalexin}
  component: cefalexin
  requires: [patient.weight_kg, rx.dose, rx.frequency, dispensed.strength]
  params:
    basis: per_dose
    range_mg_per_kg: [25, 25]
    weight_bands:
      - {min: 3, max: 6, dose_mg: 125, per_day: 2}
      - {min: 6, max: 10, dose_mg: 250, per_day: 2}
      - {min: 10, max: 15, dose_mg: 375, per_day: 2}
      - {min: 15, max: 20, dose_mg: 500, per_day: 2}
      - {min: 20, max: 30, dose_mg: 625, per_day: 2}
      - {min: 30, dose_mg: 500, per_day: 3, adult: true}
    mg_per_kg_below_kg: 30
  source:
    ref: WHO-AWARE-2022
    locator: {printed_page: 643, pdf_page: 659, table: "50.1", row: Cefalexin}
    quote:
      - "Oral: 25 mg/kg/dose given every 12 hours"
      - "3–< 6 kg: 125 mg given every 12 hours"
      - "20–< 30 kg: 625 mg given every 12 hours"
      - "≥ 30 kg: use adult dose"
  related_sources:
    - ref: WHO-AWARE-2022
      locator: {printed_page: 631, pdf_page: 647, table: "49.1", row: Cefalexin}
      quote: "Oral: 500 mg given every 8 hours"

- id: AWARE-CFX-PED-002
  version: 1.0.0
  title: Cefalexin maximum daily dose (adult dosing)
  type: max_daily_dose
  severity: high
  applies_to: {product: cefalexin}
  component: cefalexin
  requires: [rx.dose, rx.frequency, dispensed.strength]
  params: {limit_mg: 1500, derived: "adult dose 500 mg every 8 hours = 1500 mg/day"}
  source:
    ref: WHO-AWARE-2022
    locator: {printed_page: 643, pdf_page: 659, table: "50.1", row: Cefalexin}
    quote: "Maximum daily dose: use adult dosing"
  related_sources:
    - ref: WHO-AWARE-2022
      locator: {printed_page: 631, pdf_page: 647, table: "49.1", row: Cefalexin}
      quote: "Oral: 500 mg given every 8 hours"

- id: AWARE-CFX-PED-003
  version: 1.0.0
  title: Cefalexin dosing interval
  type: frequency_allowed
  severity: moderate
  applies_to: {product: cefalexin}
  requires: [rx.frequency, patient.weight_kg]
  params:
    by_weight:
      - {min: 3, max: 30, per_day: [2]}
      - {min: 30, per_day: [3]}
  source:
    ref: WHO-AWARE-2022
    locator: {printed_page: 643, pdf_page: 659, table: "50.1", row: Cefalexin}
    quote: "Oral: 25 mg/kg/dose given every 12 hours"

