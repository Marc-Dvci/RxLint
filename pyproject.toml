[project]
name = "rxlint"
version = "0.1.0"
description = "Static analysis for medication dispensing: NVIDIA Nemotron perception, a deterministic WHO AWaRe rule kernel, and live regulator surveillance."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pillow>=10",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "rapidocr-onnxruntime>=1.3",
  "lightgbm>=4.3",
]

[project.optional-dependencies]
bench = ["scikit-learn>=1.4", "pymupdf>=1.24"]
dev = ["pytest>=8", "hypothesis>=6", "playwright>=1.45", "scikit-learn>=1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rxlint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
